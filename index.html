<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Keno - Ethio Lottery Clone</title>
    <style>
        :root {
            --bg-darkest: #0b0f12;
            --bg-panel: #161d24;
            --bg-grid-cell: #202b36;
            --fast-green: #3cd371;
            --text-light: #ffffff;
            --text-muted: #7e8e9f;
            --glow-cyan: #00f0ff;
            --cell-border: #2c3b49;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-darkest);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* Responsive Mobile Container Viewport scaling */
        .phone-wrapper {
            width: 100%;
            max-width: 480px;
            background: var(--bg-darkest);
            display: flex;
            flex-direction: column;
            position: relative;
            padding-bottom: 70px; /* Space for footer */
        }

        /* Top Brand Strip Header (Matches photo_2026-05-27_18-01-00.jpg) */
        .fast-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #0f141a;
            border-bottom: 1px solid #1a222a;
        }

        .brand-logo {
            font-style: italic;
            font-weight: 900;
            line-height: 1;
        }
        .brand-logo div:first-child { color: var(--text-light); font-size: 0.9rem; }
        .brand-logo div:last-child { color: var(--fast-green); font-size: 1.2rem; margin-top: -2px; }

        .header-meta {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .meta-pill {
            background: rgba(32, 43, 54, 0.6);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .pill-val-gold { color: #f59e0b; }
        .pill-check { color: var(--fast-green); font-size: 0.8rem; }

        /* Glowing Loop Timer Section */
        .timer-strip {
            text-align: center;
            padding: 4px 0;
            font-family: monospace;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--glow-cyan);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
            letter-spacing: 1px;
        }

        /* Dynamic Main Banner Card Display (Switches States smoothly) */
        .display-stage {
            background: linear-gradient(180deg, #16222f 0%, #0f161e 100%);
            margin: 0 12px 12px 12px;
            border-radius: 12px;
            padding: 20px;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            border: 1px solid rgba(255,255,255,0.03);
            overflow: hidden;
        }

        /* Radar sweeping background simulation lines */
        .display-stage::before {
            content: '';
            position: absolute;
            width: 300px; height: 300px;
            border: 1px solid rgba(0, 240, 255, 0.04);
            border-radius: 50%;
            pointer-events: none;
        }

        .stage-prompt {
            font-size: 1.6rem;
            font-weight: bold;
            text-align: center;
            line-height: 1.4;
        }
        .stage-subprompt {
            color: var(--fast-green);
            font-weight: bold;
            margin-top: 8px;
            font-size: 1.2rem;
        }

        /* Ball drop layouts for active draw state (Matches photo_2026-05-27_18-01-55.jpg) */
        .draw-ball-matrix {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 6px;
            width: 100%;
        }

        .ball-capsule {
            aspect-ratio: 1;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #506680 0%, #1e2936 70%, #0b1118 100%);
            border: 1px solid #6b7c96;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 0.85rem;
            color: #fff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            animation: ballPop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes ballPop {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Main Keno 80 Numerical Grid Layout */
        .grid-section {
            padding: 0 12px;
            flex-grow: 1;
        }

        .fast-grid-80 {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 5px;
        }

        .grid-cell {
            aspect-ratio: 1;
            background: var(--bg-grid-cell);
            border: 1px solid var(--cell-border);
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1rem;
            color: var(--text-muted);
            cursor: pointer;
            position: relative;
            transition: background 0.1s;
        }

        /* Dynamic Corner Pin indicators for chosen numbers (Matches photo_2026-05-27_18-02-03.jpg) */
        .grid-cell.selected-pin::after {
            content: '';
            position: absolute;
            top: 2px; right: 2px;
            width: 5px; height: 5px;
            border-radius: 50%;
            background-color: var(--glow-cyan);
            box-shadow: 0 0 4px var(--glow-cyan);
        }

        /* Pure solid hit conversion layout block */
        .grid-cell.hit-block {
            background-color: var(--fast-green) !important;
            color: var(--bg-darkest) !important;
            border-color: var(--fast-green);
        }

        /* Action Console Board Wrapper */
        .action-tray {
            padding: 12px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            background: #0f141a;
            border-top: 1px solid #1a222a;
            margin-top: 15px;
        }

        .tray-btn {
            padding: 12px 4px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            color: #fff;
            background: #202b36;
            border: 1px solid #2c3b49;
            transition: opacity 0.1s;
        }

        .tray-btn.primary-draw {
            background: var(--fast-green);
            color: var(--bg-darkest);
            border: none;
        }

        /* Persistent Bottom App Navigation simulation */
        .bottom-navbar {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 60px;
            background: #090d12;
            border-top: 1px solid #151b22;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            align-items: center;
            text-align: center;
        }

        .nav-item {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 2px;
            cursor: pointer;
        }
        .nav-item.active { color: var(--fast-green); }
        .nav-icon { font-size: 1.1rem; font-weight: bold; }
    </style>
</head>
<body>

<div class="phone-wrapper">
    <!-- Fast Keno Header -->
    <div class="fast-header">
        <div class="brand-logo">
            <div>FAST</div>
            <div>KENO</div>
        </div>
        <div class="header-meta">
            <div class="meta-pill"><span class="pill-val-gold" id="top-balance">1000.00</span> <span style="font-size:0.7rem;color:var(--text-muted)">ETB</span></div>
            <div class="meta-pill">ID: <span id="game-id-view">233987</span> <span class="pill-check">✔</span></div>
        </div>
    </div>

    <!-- Live Timer Strip -->
    <div class="timer-strip" id="countdown-clock">00:30</div>

    <!-- Center Display Stage Board -->
    <div class="display-stage" id="stage-panel">
        <!-- Default Choice Promo state structure handles rendering -->
        <div class="stage-prompt">Choose 10<br>numbers</div>
        <div class="stage-subprompt">From 1 to 80</div>
    </div>

    <!-- Number Canvas Board -->
    <div class="grid-section">
        <div class="fast-grid-80" id="main-canvas"></div>
    </div>

    <!-- Active Management Tray -->
    <div class="action-tray">
        <button class="tray-btn" id="ctrl-bet">Bet +10</button>
        <button class="tray-btn" id="ctrl-quick">Quick Pick</button>
        <button class="tray-btn" id="ctrl-clear">Clear</button>
        <button class="tray-btn primary-draw" id="ctrl-action">Draw</button>
    </div>

    <!-- Simulation Bottom Bar Interface Navigation -->
    <div class="bottom-navbar">
        <div class="nav-item active"><span class="nav-icon">🎮</span><span>GAME</span></div>
        <div class="nav-item"><span class="nav-icon">⏳</span><span>HISTORY</span></div>
        <div class="nav-item"><span class="nav-icon">✔</span><span>RESULTS</span></div>
        <div class="nav-item"><span class="nav-icon">📊</span><span>STATS</span></div>
    </div>
</div>

<script>
    let appState = {
        balance: 1000.00,
        bet: 10,
        selected: [],
        drawn: [],
        isDrawing: false,
        timerVal: 30,
        gameId: 233987
    };

    const canvasEl = document.getElementById('main-canvas');
    const stagePanelEl = document.getElementById('stage-panel');
    const clockEl = document.getElementById('countdown-clock');

    // Run continuous countdown sequence mimicking real lottery telemetry
    function startGlobalTimerLoop() {
        setInterval(() => {
            if (!appState.isDrawing) {
                if (appState.timerVal > 0) {
                    appState.timerVal--;
                    let sec = appState.timerVal < 10 ? '0' + appState.timerVal : appState.timerVal;
                    clockEl.textContent = `00:${sec}`;
                } else {
                    // Trigger automated drop execution loop when clock drains
                    executeDrawCycle();
                }
            }
        }, 1000);
    }

    function initCanvas() {
        canvasEl.innerHTML = '';
        for (let i = 1; i <= 80; i++) {
            const cell = document.createElement('div');
            cell.className = 'grid-cell';
            cell.textContent = i;
            cell.addEventListener('click', () => handleCellSelection(i));
            canvasEl.appendChild(cell);
        }
    }

    function handleCellSelection(num) {
        if (appState.isDrawing) return;
        
        // Clear past draw states instantly if selecting on new block line
        if (appState.drawn.length > 0) {
            appState.drawn = [];
            setStagePromptDefault();
        }

        const index = appState.selected.indexOf(num);
        if (index > -1) {
            appState.selected.splice(index, 1);
        } else {
            if (appState.selected.length >= 10) return; // Strict Fast Keno 10 spot ceiling 
            appState.selected.push(num);
        }
        syncVisualGrid();
    }

    function setStagePromptDefault() {
        stagePanelEl.innerHTML = `
            <div class="stage-prompt">Choose 10<br>numbers</div>
            <div class="stage-subprompt">From 1 to 80</div>
        `;
    }

    function syncVisualGrid() {
        const cells = canvasEl.children;
        for (let i = 1; i <= 80; i++) {
            const cell = cells[i - 1];
            cell.className = 'grid-cell';

            const isSelected = appState.selected.includes(i);
            const isDrawn = appState.drawn.includes(i);

            if (isSelected && isDrawn) {
                cell.classList.add('hit-block');
            } else if (isSelected) {
                cell.classList.add('selected-pin');
            }
        }

        // Sync Balance Text Info
        document.getElementById('top-balance').textContent = appState.balance.toFixed(2);
        document.getElementById('game-id-view').textContent = appState.gameId;
        
        // Dynamic Lockouts
        document.getElementById('ctrl-action').disabled = appState.isDrawing;
        document.getElementById('ctrl-clear').disabled = appState.isDrawing;
        document.getElementById('ctrl-quick').disabled = appState.isDrawing;
    }

    function executeDrawCycle() {
        if (appState.selected.length === 0) {
            // Auto force-inject pick selections if player lets clock lapse empty
            forcedQuickPick();
        }

        appState.isDrawing = true;
        appState.balance -= appState.bet;
        appState.drawn = [];
        syncVisualGrid();

        // Clear panel layout structure to load ball matrix drop grids (Matches photo_2026-05-27_18-01-55.jpg)
        stagePanelEl.innerHTML = `<div class="draw-ball-matrix" id="ball-box-wrapper"></div>`;
        const ballContainer = document.getElementById('ball-box-wrapper');

        let drawPool = Array.from({length: 80}, (_, i) => i + 1);
        let count = 0;

        let interval = setInterval(() => {
            if (count < 20) {
                let rIdx = Math.floor(Math.random() * drawPool.length);
                let selectedBall = drawPool.splice(rIdx, 1)[0];
                
                appState.drawn.push(selectedBall);
                
                // Append ball capsule element nodes instantly
                const ballNode = document.createElement('div');
                ballNode.className = 'ball-capsule';
                ballNode.textContent = selectedBall;
                ballContainer.appendChild(ballNode);

                syncVisualGrid();
                count++;
            } else {
                clearInterval(interval);
                finalizeCalculations();
            }
        }, 150); // Velocity velocity cadence match
    }

    function finalizeCalculations() {
        // Mock evaluation simple multiplier loop
        const hits = appState.selected.filter(n => appState.drawn.includes(n)).length;
        if (hits > 0) {
            let winPrize = appState.bet * (hits * 1.5);
            appState.balance += winPrize;
        }

        appState.isDrawing = false;
        appState.timerVal = 30; // Reset loop clock frame
        appState.gameId += 1;   // Advance sequence round marker
        syncVisualGrid();
    }

    function forcedQuickPick() {
        appState.selected = [];
        while(appState.selected.length < 10) {
            let r = Math.floor(Math.random() * 80) + 1;
            if(!appState.selected.includes(r)) appState.selected.push(r);
        }
    }

    // Interactive Core Control Wireups
    document.getElementById('ctrl-clear').addEventListener('click', () => {
        appState.selected = [];
        appState.drawn = [];
        setStagePromptDefault();
        syncVisualGrid();
    });

    document.getElementById('ctrl-quick').addEventListener('click', () => {
        appState.drawn = [];
        forcedQuickPick();
        setStagePromptDefault();
        syncVisualGrid();
    });

    document.getElementById('ctrl-bet').addEventListener('click', () => {
        appState.bet = appState.bet >= 50 ? 10 : appState.bet + 10;
        document.getElementById('ctrl-bet').textContent = `Bet +${appState.bet}`;
    });

    document.getElementById('ctrl-action').addEventListener('click', () => {
        if (!appState.isDrawing) executeDrawCycle();
    });

    // Run Framework Execution
    initCanvas();
    syncVisualGrid();
    startGlobalTimerLoop();
</script>
</body>
</html>
