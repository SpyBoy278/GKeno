<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino Keno - Atlas-V Replica</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-panel: #1e293b;
            --grid-border: #334155;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --accent-gold: #fbbf24;
            --selected-blue: #3b82f6;
            --hit-green: #22c55e;
            --miss-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            width: 100%;
            max-width: 1100px;
            background: var(--bg-panel);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Left Side: Paytable & Stats */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--grid-border);
        }

        .hud-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-main);
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-gold);
        }

        .hud-label { color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; }
        .hud-value { font-weight: bold; font-size: 1.2rem; color: var(--text-light); }

        .paytable-box {
            flex-grow: 1;
        }

        .paytable-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            color: var(--accent-gold);
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: 1px;
        }

        .paytable-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            padding: 6px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.9rem;
        }
        .paytable-row.highlight {
            background: rgba(59, 130, 246, 0.2);
            color: var(--accent-gold);
            font-weight: bold;
        }

        /* Right Side: Grid and Dashboard Controls */
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .keno-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 8px;
            background: rgba(0,0,0,0.3);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--grid-border);
        }

        .cell {
            aspect-ratio: 1;
            background: var(--bg-panel);
            border: 1px solid var(--grid-border);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .cell:hover {
            transform: scale(1.05);
            border-color: var(--accent-gold);
        }

        /* Cell States matching Atlas-V Visuals */
        .cell.selected { background-color: var(--selected-blue); color: white; }
        .cell.drawn { background-color: var(--miss-red); color: white; }
        .cell.hit { 
            background-color: var(--hit-green); 
            color: white; 
            box-shadow: 0 0 12px var(--hit-green);
            animation: pulse 0.5s ease;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* Controls Dashboard */
        .controls {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.2s;
            color: white;
        }

        .btn-secondary { background: #475569; }
        .btn-secondary:hover { background: #64748b; }
        .btn-action { background: #d97706; }
        .btn-action:hover { background: #f59e0b; }
        .btn-play { background: #16a34a; font-size: 1.1rem; }
        .btn-play:hover { background: #22c55e; }
        button:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }
    </style>
</head>
<body>

<div class="game-container">
    <div class="sidebar">
        <div class="hud-item">
            <span class="hud-label">Credits</span>
            <span class="hud-value" id="balance-display">$1,000.00</span>
        </div>
        <div class="hud-item">
            <span class="hud-label">Bet</span>
            <span class="hud-value" id="bet-display">$5.00</span>
        </div>
        <div class="hud-item">
            <span class="hud-label">Hits</span>
            <span class="hud-value" id="hits-display">0 / 0</span>
        </div>
        
        <div class="paytable-box">
            <div class="paytable-title">Payout Matrix</div>
            <div id="paytable-rows">
                </div>
        </div>
    </div>

    <div class="main-content">
        <div class="keno-grid" id="grid"></div>
        
        <div class="controls">
            <button class="btn-secondary" id="btn-bet">Bet +$5</button>
            <button class="btn-secondary" id="btn-quick">Quick Pick</button>
            <button class="btn-secondary" id="btn-clear">Clear</button>
            <button class="btn-play" id="btn-play">Draw</button>
        </div>
    </div>
</div>

<script>
    // Hypergeometric Authentic Casino Paytable Rules 
    // Format: [spotsSelected]: { [hits]: multiplier }
    const PAYTABLE_MAP = {
        1: { 1: 3 },
        2: { 1: 1, 2: 9 },
        3: { 2: 2, 3: 16 },
        4: { 2: 1, 3: 6, 4: 80 },
        5: { 2: 1, 3: 3, 4: 12, 5: 400 },
        6: { 3: 3, 4: 7, 5: 60, 6: 1600 },
        7: { 3: 1, 4: 5, 5: 21, 6: 250, 7: 5000 },
        8: { 4: 3, 5: 12, 6: 100, 7: 1500, 8: 15000 },
        9: { 4: 2, 5: 9, 6: 54, 7: 400, 8: 4000, 9: 25000 },
        10: { 0: 2, 5: 5, 6: 24, 7: 140, 8: 1200, 9: 10000, 10: 100000 }
    };

    let state = {
        balance: 1000,
        bet: 5,
        selected: [],
        drawn: [],
        isDrawing: false
    };

    const gridEl = document.getElementById('grid');
    const paytableRowsEl = document.getElementById('paytable-rows');

    // Initialize the 80 Ball Grid Element
    function initGrid() {
        gridEl.innerHTML = '';
        for (let i = 1; i <= 80; i++) {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            cell.textContent = i;
            cell.addEventListener('click', () => handleCellClick(i));
            gridEl.appendChild(cell);
        }
    }

    function handleCellClick(num) {
        if (state.isDrawing) return;
        
        // Reset boards on selection if a previous round completed
        if (state.drawn.length > 0) { resetRoundVisuals(); }

        const idx = state.selected.indexOf(num);
        if (idx > -1) {
            state.selected.splice(idx, 1);
        } else {
            if (state.selected.length >= 10) return; // Standard casino spot cap
            state.selected.push(num);
        }
        updateUI();
    }

    function updateUI() {
        // Sync Grid Cell States
        const cells = gridEl.children;
        for (let i = 1; i <= 80; i++) {
            const cell = cells[i - 1];
            cell.className = 'cell'; // clear states
            
            const isSel = state.selected.includes(i);
            const isDrwn = state.drawn.includes(i);

            if (isSel && isDrwn) cell.classList.add('hit');
            else if (isSel) cell.classList.add('selected');
            else if (isDrwn) cell.classList.add('drawn');
        }

        // Sync HUD Strings
        document.getElementById('balance-display').textContent = `$${state.balance.toFixed(2)}`;
        document.getElementById('bet-display').textContent = `$${state.bet.toFixed(2)}`;
        
        const hits = state.selected.filter(n => state.drawn.includes(n)).length;
        document.getElementById('hits-display').textContent = `${hits} / ${state.selected.length}`;

        // Build Dynamic Sidebar Paytable Layout
        renderPaytable(hits);

        // Control Lockouts
        document.getElementById('btn-play').disabled = state.selected.length === 0 || state.isDrawing;
        document.getElementById('btn-clear').disabled = state.isDrawing;
        document.getElementById('btn-quick').disabled = state.isDrawing;
        document.getElementById('btn-bet').disabled = state.isDrawing;
    }

    function renderPaytable(currentHitCount) {
        paytableRowsEl.innerHTML = '';
        const spots = state.selected.length;
        if (spots === 0) {
            paytableRowsEl.innerHTML = '<div style="color:var(--text-muted); text-align:center; padding:20px; font-size:0.85rem;">Select spots on the grid to populate payouts.</div>';
            return;
        }

        const payouts = PAYTABLE_MAP[spots] || {};
        // Layout all possible successful match scenarios sorted by payout size
        Object.keys(payouts).forEach(hitKey => {
            const hitNum = parseInt(hitKey);
            const mult = payouts[hitNum];
            const winAmount = state.bet * mult;
            
            const row = document.createElement('div');
            row.classList.add('paytable-row');
            if (state.drawn.length > 0 && currentHitCount === hitNum) {
                row.classList.add('highlight'); // Highlight exact winning tier
            }
            
            row.innerHTML = `<span>Hit ${hitNum}</span><span>$${winAmount.toFixed(2)}</span>`;
            paytableRowsEl.appendChild(row);
        });
    }

    function resetRoundVisuals() {
        state.drawn = [];
    }

    // Quick Pick Feature
    document.getElementById('btn-quick').addEventListener('click', () => {
        resetRoundVisuals();
        state.selected = [];
        while(state.selected.length < 10) {
            let r = Math.floor(Math.random() * 80) + 1;
            if(!state.selected.includes(r)) state.selected.push(r);
        }
        updateUI();
    });

    // Clear Feature
    document.getElementById('btn-clear').addEventListener('click', () => {
        resetRoundVisuals();
        state.selected = [];
        updateUI();
    });

    // Bet Adjustment Cycle
    document.getElementById('btn-bet').addEventListener('click', () => {
        resetRoundVisuals();
        state.bet = state.bet >= 25 ? 5 : state.bet + 5;
        updateUI();
    });

    // The Drawing Loop Logic Engine
    document.getElementById('btn-play').addEventListener('click', () => {
        if (state.balance < state.bet) {
            alert("Insufficient Balance!");
            return;
        }
        
        state.balance -= state.bet;
        state.drawn = [];
        state.isDrawing = true;
        updateUI();

        // Standard 20 number drawing tracking pool
        let pool = Array.from({length: 80}, (_, i) => i + 1);
        let drawsLeft = 20;

        let interval = setInterval(() => {
            if (drawsLeft > 0) {
                let randIdx = Math.floor(Math.random() * pool.length);
                let ball = pool.splice(randIdx, 1)[0];
                state.drawn.push(ball);
                updateUI();
                drawsLeft--;
            } else {
                clearInterval(interval);
                evaluateWin();
            }
        }, 120); // 120ms delay replicates the smooth mechanical cascade of Atlas-V displays
    });

    function evaluateWin() {
        state.isDrawing = false;
        const spots = state.selected.length;
        const hits = state.selected.filter(n => state.drawn.includes(n)).length;
        
        const payouts = PAYTABLE_MAP[spots] || {};
        if (payouts[hits]) {
            const prize = state.bet * payouts[hits];
            state.balance += prize;
        }
        updateUI();
    }

    // Start App Instance
    initGrid();
    updateUI();
</script>

</body>
</html>
