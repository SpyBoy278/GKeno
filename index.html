<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethio Lottery Virtual Keno Replica</title>
    <style>
        :root {
            --bg-main: #090d16;
            --bg-panel: #111827;
            --grid-border: #1f2937;
            --text-light: #f9fafb;
            --text-muted: #6b7280;
            --ethio-green: #10b981;
            --ethio-yellow: #f59e0b;
            --ethio-red: #ef4444;
            --selected-glow: #06b6d4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .game-container {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            width: 100%;
            max-width: 1150px;
            background: var(--bg-panel);
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #1e293b;
        }

        /* Sidebar / Info Layout */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--grid-border);
        }

        .brand-header {
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--ethio-yellow);
            font-weight: bold;
            font-size: 1.2rem;
            letter-spacing: 1px;
            color: var(--text-light);
        }

        .hud-card {
            background: #1f2937;
            padding: 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-right: 4px solid var(--ethio-green);
        }

        .hud-label { color: var(--text-muted); font-size: 0.8rem; font-weight: bold; }
        .hud-value { font-size: 1.15rem; font-weight: bold; color: var(--ethio-yellow); }

        .paytable-wrapper {
            flex-grow: 1;
        }

        .matrix-header {
            font-size: 0.85rem;
            color: var(--ethio-green);
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: bold;
            text-align: center;
        }

        .payout-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            padding: 8px 12px;
            border-bottom: 1px solid #1f2937;
            font-size: 0.9rem;
        }

        .payout-row.active-win {
            background: rgba(16, 185, 129, 0.25);
            border: 1px solid var(--ethio-green);
            color: #fff;
            font-weight: bold;
        }

        /* Main Grid Area */
        .board-layout {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .keno-grid-80 {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 6px;
            background: rgba(0, 0, 0, 0.25);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--grid-border);
        }

        .number-node {
            aspect-ratio: 1.1;
            background: #111827;
            border: 1px solid #374151;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.1s ease;
            color: #9ca3af;
        }

        .number-node:hover {
            border-color: var(--ethio-yellow);
            color: #fff;
        }

        /* State Mapping matching Virtual Layouts */
        .number-node.selected {
            background: var(--selected-glow);
            border-color: #06b6d4;
            color: #000;
        }

        .number-node.drawn-miss {
            background: var(--ethio-red);
            border-color: #f87171;
            color: #fff;
        }

        .number-node.drawn-hit {
            background: var(--ethio-green);
            border-color: #34d399;
            color: #fff;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.6);
            animation: hitBounce 0.4s ease;
        }

        @keyframes hitBounce {
            0% { transform: scale(1); }
            50% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }

        /* Interactive Control Dashboard */
        .dashboard-controls {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .ctrl-btn {
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            color: #fff;
            transition: background 0.15s;
        }

        .btn-config { background: #374151; border: 1px solid #4b5563; }
        .btn-config:hover { background: #4b5563; }
        .btn-start { background: var(--ethio-green); font-size: 1.05rem; }
        .btn-start:hover { background: #059669; }
        
        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="game-container">
    <!-- Left Interface Column -->
    <div class="sidebar">
        <div class="brand-header">VIRTUAL KENO</div>
        
        <div class="hud-card">
            <span class="hud-label">ማስቀመጫ (Balance)</span>
            <span class="hud-value" id="wallet-view">1,000.00 ETB</span>
        </div>
        <div class="hud-card">
            <span class="hud-label">ውርርድ (Bet)</span>
            <span class="hud-value" id="wager-view">10.00 ETB</span>
        </div>
        <div class="hud-card">
            <span class="hud-label">ምርጫ (Picks)</span>
            <span class="hud-value" id="count-view">0 / 8</span>
        </div>

        <div class="paytable-wrapper">
            <div class="matrix-header">የክፍያ ሰንጠረዥ (Paytable)</div>
            <div id="matrix-rows"></div>
        </div>
    </div>

    <!-- Right Interface Column -->
    <div class="board-layout">
        <div class="keno-grid-80" id="board-grid"></div>
        
        <div class="dashboard-controls">
            <button class="ctrl-btn btn-config" id="act-wager">Bet +10</button>
            <button class="ctrl-btn btn-config" id="act-auto">Quick Pick</button>
            <button class="ctrl-btn btn-config" id="act-reset">Clear</button>
            <button class="ctrl-btn btn-start" id="act-play">Start Draw</button>
        </div>
    </div>
</div>

<script>
    // Exact Virtual 1-8 spot payoff configuration map
    const ETHIO_ODDS = {
        1: { 1: 3.5 },
        2: { 1: 1, 2: 8.5 },
        3: { 2: 2.5, 3: 16 },
        4: { 2: 1, 3: 5, 4: 55 },
        5: { 2: 1, 3: 2.5, 4: 10, 5: 250 },
        6: { 3: 2, 4: 6, 5: 50, 6: 1000 },
        7: { 3: 1, 4: 3, 5: 15, 6: 120, 7: 4000 },
        8: { 4: 2, 5: 10, 6: 60, 7: 600, 8: 10000 }
    };

    let runtime = {
        wallet: 1000,
        wager: 10,
        selected: [],
        drawn: [],
        activeDraw: false
    };

    const targetGrid = document.getElementById('board-grid');
    const targetMatrix = document.getElementById('matrix-rows');

    function buildBoard() {
        targetGrid.innerHTML = '';
        for (let idx = 1; idx <= 80; idx++) {
            const node = document.createElement('div');
            node.className = 'number-node';
            node.textContent = idx;
            node.addEventListener('click', () => onNodeInteraction(idx));
            targetGrid.appendChild(node);
        }
    }

    function onNodeInteraction(numberValue) {
        if (runtime.activeDraw) return;
        if (runtime.drawn.length > 0) runtime.drawn = [];

        const positionIndex = runtime.selected.indexOf(numberValue);
        if (positionIndex > -1) {
            runtime.selected.splice(positionIndex, 1);
        } else {
            if (runtime.selected.length >= 8) return; // Strict Ethio Lottery 8 spot ceiling
            runtime.selected.push(numberValue);
        }
        refreshInterface();
    }

    function refreshInterface() {
        const structuralNodes = targetGrid.children;
        for (let currentNum = 1; currentNum <= 80; currentNum++) {
            const loopNode = structuralNodes[currentNum - 1];
            loopNode.className = 'number-node';

            const activeSelection = runtime.selected.includes(currentNum);
            const activeDrawPool = runtime.drawn.includes(currentNum);

            if (activeSelection && activeDrawPool) loopNode.classList.add('drawn-hit');
            else if (activeSelection) loopNode.classList.add('selected');
            else if (activeDrawPool) loopNode.classList.add('drawn-miss');
        }

        // Value Displays
        document.getElementById('wallet-view').textContent = `${runtime.wallet.toFixed(2)} ETB`;
        document.getElementById('wager-view').textContent = `${runtime.wager.toFixed(2)} ETB`;
        
        const matchedHits = runtime.selected.filter(val => runtime.drawn.includes(val)).length;
        document.getElementById('count-view').textContent = `${runtime.selected.length} / 8`;

        renderOddsMatrix(matchedHits);

        // Control Validation Lockouts
        document.getElementById('act-play').disabled = runtime.selected.length === 0 || runtime.activeDraw;
        document.getElementById('act-reset').disabled = runtime.activeDraw;
        document.getElementById('act-auto').disabled = runtime.activeDraw;
        document.getElementById('act-wager').disabled = runtime.activeDraw;
    }

    function renderOddsMatrix(currentHitCount) {
        targetMatrix.innerHTML = '';
        const currentSelectedLength = runtime.selected.length;

        if (currentSelectedLength === 0) {
            targetMatrix.innerHTML = '<div style="color:var(--text-muted); text-align:center; padding:25px; font-size:0.8rem;">ቁጥሮችን ይምረጡ (Select numbers to view paytable)</div>';
            return;
        }

        const tierPrizes = ETHIO_ODDS[currentSelectedLength] || {};
        Object.keys(tierPrizes).forEach(matchCountKey => {
            const matchInt = parseInt(matchCountKey);
            const oddsRatio = tierPrizes[matchInt];
            const localizedPrizeValue = runtime.wager * oddsRatio;

            const entryRow = document.createElement('div');
            entryRow.className = 'payout-row';
            if (runtime.drawn.length > 0 && currentHitCount === matchInt) {
                entryRow.classList.add('active-win');
            }

            entryRow.innerHTML = `<span>ይውጡ ${matchInt} (Hit ${matchInt})</span><span>${localizedPrizeValue.toFixed(2)} ETB</span>`;
            targetMatrix.appendChild(entryRow);
        });
    }

    // Interactive Button Hooks
    document.getElementById('act-wager').addEventListener('click', () => {
        runtime.drawn = [];
        runtime.wager = runtime.wager >= 50 ? 10 : runtime.wager + 10;
        refreshInterface();
    });

    document.getElementById('act-auto').addEventListener('click', () => {
        runtime.drawn = [];
        runtime.selected = [];
        while (runtime.selected.length < 8) {
            let generatedVal = Math.floor(Math.random() * 80) + 1;
            if (!runtime.selected.includes(generatedVal)) runtime.selected.push(generatedVal);
        }
        refreshInterface();
    });

    document.getElementById('act-reset').addEventListener('click', () => {
        runtime.drawn = [];
        runtime.selected = [];
        refreshInterface();
    });

    document.getElementById('act-play').addEventListener('click', () => {
        if (runtime.wallet < runtime.wager) {
            alert("ይቅርታ፣ በቂ ገንዘብ የለም! (Insufficient Balance)");
            return;
        }

        runtime.wallet -= runtime.wager;
        runtime.drawn = [];
        runtime.activeDraw = true;
        refreshInterface();

        let processingPool = Array.from({length: 80}, (_, indexOffset) => indexOffset + 1);
        let trackingBallsToDraw = 20;

        let sequenceLoop = setInterval(() => {
            if (trackingBallsToDraw > 0) {
                let selectionIndex = Math.floor(Math.random() * processingPool.length);
                let selectedBallValue = processingPool.splice(selectionIndex, 1)[0];
                runtime.drawn.push(selectedBallValue);
                refreshInterface();
                trackingBallsToDraw--;
            } else {
                clearInterval(sequenceLoop);
                calculateFinalReturns();
            }
        }, 150); // Paced to match the digital telemetry display of modern lottery systems
    });

    function calculateFinalReturns() {
        runtime.activeDraw = false;
        const totalPicksSelected = runtime.selected.length;
        const totalMatchesFound = runtime.selected.filter(val => runtime.drawn.includes(val)).length;

        const dynamicTargetMap = ETHIO_ODDS[totalPicksSelected] || {};
        if (dynamicTargetMap[totalMatchesFound]) {
            const allocatedWinnings = runtime.wager * dynamicTargetMap[totalMatchesFound];
            runtime.wallet += allocatedWinnings;
        }
        refreshInterface();
    }

    // App Initialization
    buildBoard();
    refreshInterface();
</script>

</body>
</html>
