<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethio Virtual Keno - Premium Edition</title>
    <style>
        :root {
            --bg-main: #060913;
            --bg-panel: #0d1326;
            --grid-border: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #64748b;
            --ethio-green: #10b981;
            --ethio-yellow: #fbbf24;
            --ethio-red: #ef4444;
            --neon-glow: #22d3ee;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 24px;
            width: 100%;
            max-width: 1200px;
            background: var(--bg-panel);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
        }

        /* Top Display Strip Bar Layout mimicking the Atlas-V header */
        .top-glow-banner {
            grid-column: span 2;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid var(--grid-border);
            padding: 15px 25px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
            position: relative;
            overflow: hidden;
        }

        .top-glow-banner::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, var(--ethio-green), var(--ethio-yellow), var(--neon-glow));
        }

        .banner-title {
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--ethio-yellow);
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.4);
        }

        .banner-stats {
            display: flex;
            gap: 30px;
        }

        .stat-node {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .stat-lbl { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: bold; }
        .stat-val { font-size: 1.3rem; font-weight: bold; color: var(--text-light); }
        .stat-val.highlight { color: var(--ethio-green); text-shadow: 0 0 8px var(--ethio-green); }

        /* Sidebar / Info Layout */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: rgba(0, 0, 0, 0.4);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--grid-border);
        }

        .hud-card {
            background: #111827;
            padding: 14px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--neon-glow);
        }

        .hud-label { color: var(--text-muted); font-size: 0.8rem; font-weight: bold; }
        .hud-value { font-size: 1.2rem; font-weight: bold; color: var(--ethio-yellow); }

        .paytable-wrapper {
            flex-grow: 1;
        }

        .matrix-header {
            font-size: 0.85rem;
            color: var(--neon-glow);
            text-transform: uppercase;
            margin-bottom: 12px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .payout-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .payout-row.active-win {
            background: rgba(34, 211, 238, 0.15);
            border: 1px solid var(--neon-glow);
            color: #fff;
            font-weight: bold;
            text-shadow: 0 0 5px var(--neon-glow);
        }

        /* Main Grid Area */
        .board-layout {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .keno-grid-80 {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 8px;
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--grid-border);
        }

        .number-node {
            aspect-ratio: 1.1;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            position: relative;
            transition: all 0.1s ease;
            color: #4b5563;
        }

        .number-node:hover {
            border-color: var(--neon-glow);
            color: #fff;
        }

        /* Authentic Atlas-V High-Glow & Burst States */
        .number-node.selected {
            background: #1e293b;
            border: 2px solid var(--neon-glow);
            color: var(--neon-glow);
            box-shadow: inset 0 0 10px rgba(34, 211, 238, 0.2);
        }

        /* Standard drawn ball backdrop color change */
        .number-node.drawn-miss {
            background: #3f1a24;
            border-color: var(--ethio-red);
            color: #fff;
        }

        /* Golden flash overlay matching the image header panels */
        .number-node.drawn-hit {
            background: #064e3b;
            border-color: var(--ethio-green);
            color: #fff;
            font-size: 1.25rem;
            text-shadow: 0 0 8px #fff;
            animation: casinoGlowBurst 0.5s ease-out infinite alternate;
        }

        /* Neon ring overlay element that expands on draw */
        .glowing-ring {
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            border-radius: 6px;
            pointer-events: none;
            border: 3px solid var(--ethio-yellow);
            box-shadow: 0 0 20px var(--ethio-yellow), inset 0 0 10px var(--ethio-yellow);
            animation: ringExpand 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .number-node.drawn-hit .glowing-ring {
            border-color: var(--ethio-green);
            box-shadow: 0 0 25px var(--ethio-green), inset 0 0 15px var(--ethio-green);
        }

        /* Keyframes for Glowing Engine */
        @keyframes ringExpand {
            0% { transform: scale(0.6); opacity: 0; }
            50% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes casinoGlowBurst {
            0% { box-shadow: 0 0 10px rgba(16, 185, 129, 0.5); }
            100% { box-shadow: 0 0 25px rgba(16, 185, 129, 0.9), inset 0 0 10px rgba(255,255,255,0.4); }
        }

        /* Control Dashboard Buttons */
        .dashboard-controls {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .ctrl-btn {
            padding: 16px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            color: #fff;
            text-transform: uppercase;
            transition: all 0.15s;
        }

        .btn-config { background: #1e293b; border: 1px solid #334155; }
        .btn-config:hover { background: #334155; }
        .btn-start { 
            background: linear-gradient(135deg, #059669, #10b981); 
            font-size: 1.05rem; 
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
        }
        .btn-start:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5); }
        
        button:disabled {
            opacity: 0.25;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
    </style>
</head>
<body>

<div class="game-container">
    <!-- Top Display Glow Strip Strip -->
    <div class="top-glow-banner">
        <div class="banner-title">ETHIO VIRTUAL KENO</div>
        <div class="banner-stats">
            <div class="stat-node">
                <span class="stat-lbl">የመጨረሻ ዕጣ (Last Draw Hit)</span>
                <span class="stat-val id-glow" id="header-hits" style="color:var(--ethio-yellow)">0</span>
            </div>
            <div class="stat-node">
                <span class="stat-lbl">አጠቃላይ አሸናፊ (Total Win)</span>
                <span class="stat-val highlight" id="header-win">0.00 ETB</span>
            </div>
        </div>
    </div>

    <!-- Left Column -->
    <div class="sidebar">
        <div class="hud-card">
            <span class="hud-label">ማስቀመጫ (Balance)</span>
            <span class="hud-value" id="wallet-view">1,000.00 ETB</span>
        </div>
        <div class="hud-card">
            <span class="hud-label">ውርርድ (Bet)</span>
            <span class="hud-value" id="wager-view">10.00 ETB</span>
        </div>
        <div class="hud-card">
            <span class="hud-label">ምርጫ (Picks)</span>
            <span class="hud-value" id="count-view">0 / 8</span>
        </div>

        <div class="paytable-wrapper">
            <div class="matrix-header">የክፍያ ሰንጠረዥ (Paytable Matrix)</div>
            <div id="matrix-rows"></div>
        </div>
    </div>

    <!-- Right Column Grid -->
    <div class="board-layout">
        <div class="keno-grid-80" id="board-grid"></div>
        
        <div class="dashboard-controls">
            <button class="ctrl-btn btn-config" id="act-wager">Bet +10</button>
            <button class="ctrl-btn btn-config" id="act-auto">Quick Pick</button>
            <button class="ctrl-btn btn-config" id="act-reset">Clear</button>
            <button class="ctrl-btn btn-start" id="act-play">Start Draw</button>
        </div>
    </div>
</div>

<script>
    const ETHIO_ODDS = {
        1: { 1: 3.5 },
        2: { 1: 1, 2: 8.5 },
        3: { 2: 2.5, 3: 16 },
        4: { 2: 1, 3: 5, 4: 55 },
        5: { 2: 1, 3: 2.5, 4: 10, 5: 250 },
        6: { 3: 2, 4: 6, 5: 50, 6: 1000 },
        7: { 3: 1, 4: 3, 5: 15, 6: 120, 7: 4000 },
        8: { 4: 2, 5: 10, 6: 60, 7: 600, 8: 10000 }
    };

    let runtime = {
        wallet: 1000,
        wager: 10,
        selected: [],
        drawn: [],
        activeDraw: false,
        lastRoundWin: 0
    };

    const targetGrid = document.getElementById('board-grid');
    const targetMatrix = document.getElementById('matrix-rows');

    function buildBoard() {
        targetGrid.innerHTML = '';
        for (let idx = 1; idx <= 80; idx++) {
            const node = document.createElement('div');
            node.className = 'number-node';
            node.textContent = idx;
            node.addEventListener('click', () => onNodeInteraction(idx));
            targetGrid.appendChild(node);
        }
    }

    function onNodeInteraction(numberValue) {
        if (runtime.activeDraw) return;
        if (runtime.drawn.length > 0) { runtime.drawn = []; runtime.lastRoundWin = 0; }

        const positionIndex = runtime.selected.indexOf(numberValue);
        if (positionIndex > -1) {
            runtime.selected.splice(positionIndex, 1);
        } else {
            if (runtime.selected.length >= 8) return; 
            runtime.selected.push(numberValue);
        }
        refreshInterface();
    }

    function refreshInterface() {
        const structuralNodes = targetGrid.children;
        for (let currentNum = 1; currentNum <= 80; currentNum++) {
            const loopNode = structuralNodes[currentNum - 1];
            
            // Retain selection class cleanly without wiping rings
            const activeSelection = runtime.selected.includes(currentNum);
            const activeDrawPool = runtime.drawn.includes(currentNum);

            // Manage classes
            loopNode.className = 'number-node';
            
            // Check if ring is already inside node
            const existingRing = loopNode.querySelector('.glowing-ring');

            if (activeDrawPool) {
                if (activeSelection) {
                    loopNode.classList.add('drawn-hit');
                } else {
                    loopNode.classList.add('drawn-miss');
                }
                // Append neon ring if not already added during live drawing sequence
                if (!existingRing) {
                    const ring = document.createElement('div');
                    ring.className = 'glowing-ring';
                    loopNode.appendChild(ring);
                }
            } else {
                if (existingRing) existingRing.remove();
                if (activeSelection) loopNode.classList.add('selected');
            }
        }

        // Value Displays
        document.getElementById('wallet-view').textContent = `${runtime.wallet.toFixed(2)} ETB`;
        document.getElementById('wager-view').textContent = `${runtime.wager.toFixed(2)} ETB`;
        document.getElementById('count-view').textContent = `${runtime.selected.length} / 8`;
        
        const matchedHits = runtime.selected.filter(val => runtime.drawn.includes(val)).length;
        document.getElementById('header-hits').textContent = matchedHits;
        document.getElementById('header-win').textContent = `${runtime.lastRoundWin.toFixed(2)} ETB`;

        renderOddsMatrix(matchedHits);

        // Controls Lockouts
        document.getElementById('act-play').disabled = runtime.selected.length === 0 || runtime.activeDraw;
        document.getElementById('act-reset').disabled = runtime.activeDraw;
        document.getElementById('act-auto').disabled = runtime.activeDraw;
        document.getElementById('act-wager').disabled = runtime.activeDraw;
    }

    function renderOddsMatrix(currentHitCount) {
        targetMatrix.innerHTML = '';
        const currentSelectedLength = runtime.selected.length;

        if (currentSelectedLength === 0) {
            targetMatrix.innerHTML = '<div style="color:var(--text-muted); text-align:center; padding:25px; font-size:0.8rem;">ቁጥሮችን ይምረጡ (Select numbers)</div>';
            return;
        }

        const tierPrizes = ETHIO_ODDS[currentSelectedLength] || {};
        Object.keys(tierPrizes).forEach(matchCountKey => {
            const matchInt = parseInt(matchCountKey);
            const oddsRatio = tierPrizes[matchInt];
            const localizedPrizeValue = runtime.wager * oddsRatio;

            const entryRow = document.createElement('div');
            entryRow.className = 'payout-row';
            if (runtime.drawn.length > 0 && currentHitCount === matchInt) {
                entryRow.classList.add('active-win');
            }

            entryRow.innerHTML = `<span>Hit ${matchInt}</span><span>${localizedPrizeValue.toFixed(2)} ETB</span>`;
            targetMatrix.appendChild(entryRow);
        });
    }

    document.getElementById('act-wager').addEventListener('click', () => {
        runtime.drawn = []; runtime.lastRoundWin = 0;
        runtime.wager = runtime.wager >= 50 ? 10 : runtime.wager + 10;
        refreshInterface();
    });

    document.getElementById('act-auto').addEventListener('click', () => {
        runtime.drawn = []; runtime.lastRoundWin = 0;
        runtime.selected = [];
        while (runtime.selected.length < 8) {
            let generatedVal = Math.floor(Math.random() * 80) + 1;
            if (!runtime.selected.includes(generatedVal)) runtime.selected.push(generatedVal);
        }
        refreshInterface();
    });

    document.getElementById('act-reset').addEventListener('click', () => {
        runtime.drawn = []; runtime.lastRoundWin = 0;
        runtime.selected = [];
        refreshInterface();
    });

    document.getElementById('act-play').addEventListener('click', () => {
        if (runtime.wallet < runtime.wager) {
            alert("ይቅርታ፣ በቂ ገንዘብ የለም! (Insufficient Balance)");
            return;
        }

        runtime.wallet -= runtime.wager;
        runtime.drawn = [];
        runtime.lastRoundWin = 0;
        runtime.activeDraw = true;
        refreshInterface();

        let processingPool = Array.from({length: 80}, (_, indexOffset) => indexOffset + 1);
        let trackingBallsToDraw = 20;

        let sequenceLoop = setInterval(() => {
            if (trackingBallsToDraw > 0) {
                let selectionIndex = Math.floor(Math.random() * processingPool.length);
                let selectedBallValue = processingPool.splice(selectionIndex, 1)[0];
                
                // Add drawn value instantly to trigger the new ring append rule
                runtime.drawn.push(selectedBallValue);
                refreshInterface();
                trackingBallsToDraw--;
            } else {
                clearInterval(sequenceLoop);
                calculateFinalReturns();
            }
        }, 160); // 160ms matches Atlas-V physical velocity cadence perfectly
    });

    function calculateFinalReturns() {
        runtime.activeDraw = false;
        const totalPicksSelected = runtime.selected.length;
        const totalMatchesFound = runtime.selected.filter(val => runtime.drawn.includes(val)).length;

        const dynamicTargetMap = ETHIO_ODDS[totalPicksSelected] || {};
        if (dynamicTargetMap[totalMatchesFound]) {
            runtime.lastRoundWin = runtime.wager * dynamicTargetMap[totalMatchesFound];
            runtime.wallet += runtime.lastRoundWin;
        }
        refreshInterface();
    }

    buildBoard();
    refreshInterface();
</script>

</body>
</html>
