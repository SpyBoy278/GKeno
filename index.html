<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Keno - Accurate Live Replica</title>
    <style>
        :root {
            --bg-darkest: #0b0f12;
            --bg-panel: #161d24;
            --bg-grid-cell: #202b36;
            --fast-green: #3cd371;
            --text-light: #ffffff;
            --text-muted: #7e8e9f;
            --glow-cyan: #00f0ff;
            --cell-border: #2c3b49;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-darkest);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .phone-wrapper {
            width: 100%;
            max-width: 480px;
            background: var(--bg-darkest);
            display: flex;
            flex-direction: column;
            position: relative;
            padding-bottom: 70px;
        }

        /* Top Brand Strip Header */
        .fast-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #0f141a;
            border-bottom: 1px solid #1a222a;
        }

        .brand-logo {
            font-style: italic;
            font-weight: 900;
            line-height: 1;
        }
        .brand-logo div:first-child { color: var(--text-light); font-size: 0.9rem; }
        .brand-logo div:last-child { color: var(--fast-green); font-size: 1.2rem; margin-top: -2px; }

        .header-meta {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .meta-pill {
            background: rgba(32, 43, 54, 0.6);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .pill-val-gold { color: #f59e0b; }

        /* Timer Block */
        .timer-strip {
            text-align: center;
            padding: 6px 0;
            font-family: monospace;
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--glow-cyan);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
            letter-spacing: 1px;
        }

        /* Dynamic Infobox Display Panel matching photo_2026-05-27_18-02-03_2.jpg */
        .display-stage {
            background: linear-gradient(180deg, #16222f 0%, #0f161e 100%);
            margin: 0 12px 12px 12px;
            border-radius: 12px;
            padding: 16px;
            min-height: 165px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .stage-prompt {
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
        }
        .stage-subprompt {
            color: var(--fast-green);
            font-weight: bold;
            margin-top: 8px;
            font-size: 1.2rem;
            text-align: center;
        }

        /* Possible Win Component Inner Layout */
        .possible-win-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .win-headline {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--text-light);
        }
        .win-headline span {
            color: var(--fast-green);
        }

        .matrix-table {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 4px;
        }
        .matrix-row {
            display: flex;
            gap: 16px;
            font-size: 0.9rem;
        }
        .lbl-mute { color: var(--text-muted); width: 50px; }
        .val-white { color: var(--text-light); font-weight: bold; text-align: center; min-width: 30px; }

        /* Selected Horizontal Row Strip Items */
        .horizontal-selection-strip {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            overflow-x: auto;
            padding-bottom: 2px;
        }
        .strip-box {
            width: 34px;
            height: 34px;
            background: rgba(32, 43, 54, 0.8);
            border: 1px solid var(--cell-border);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 0.95rem;
            color: var(--text-light);
            flex-shrink: 0;
        }

        /* Ball drop active game display layout */
        .draw-ball-matrix {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 6px;
            width: 100%;
        }
        .ball-capsule {
            aspect-ratio: 1;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #506680 0%, #1e2936 70%, #0b1118 100%);
            border: 1px solid #6b7c96;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 0.85rem;
            color: #fff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            animation: ballPop 0.2s ease forwards;
        }

        @keyframes ballPop {
            0% { transform: scale(0.4); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Number Board Matrix Configuration */
        .grid-section {
            padding: 0 12px;
            flex-grow: 1;
        }
        .fast-grid-80 {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 5px;
        }
        .grid-cell {
            aspect-ratio: 1;
            background: var(--bg-grid-cell);
            border: 1px solid var(--cell-border);
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1rem;
            color: var(--text-muted);
            cursor: pointer;
            position: relative;
        }

        /* Corner selector pins matching the reference screenshots */
        .grid-cell.selected-pin::after {
            content: '';
            position: absolute;
            top: 2px; right: 2px;
            width: 5px; height: 5px;
            border-radius: 50%;
            background-color: #ef4444; /* Match red corner pin accent */
            box-shadow: 0 0 4px #ef4444;
        }
        .grid-cell:nth-child(3n).selected-pin::after,
        .grid-cell:nth-child(7n).selected-pin::after {
            background-color: var(--glow-cyan); /* Alternating teal accents */
            box-shadow: 0 0 4px var(--glow-cyan);
        }

        /* Solid green block state for hit cells */
        .grid-cell.hit-block {
            background-color: var(--fast-green) !important;
            color: var(--bg-darkest) !important;
            border-color: var(--fast-green);
        }

        /* Console Control Bar Grid Layout */
        .action-tray {
            padding: 12px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: #0f141a;
            border-top: 1px solid #1a222a;
            margin-top: 15px;
        }
        .tray-btn {
            padding: 14px 4px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            color: #fff;
            background: #202b36;
            border: 1px solid #2c3b49;
        }
        .tray-info-text {
            grid-column: span 3;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Bottom Application Bar */
        .bottom-navbar {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 60px;
            background: #090d12;
            border-top: 1px solid #151b22;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            align-items: center;
            text-align: center;
        }
        .nav-item {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .nav-item.active { color: var(--fast-green); }
        .nav-icon { font-size: 1.1rem; }
    </style>
</head>
<body>

<div class="phone-wrapper">
    <!-- Fast Keno Brand Navbar Header -->
    <div class="fast-header">
        <div class="brand-logo">
            <div>FAST</div>
            <div>KENO</div>
        </div>
        <div class="header-meta">
            <div class="meta-pill"><span class="pill-val-gold" id="top-balance">1000.00</span> <span style="font-size:0.7rem;color:var(--text-muted)">ETB</span></div>
            <div class="meta-pill">ID: <span id="game-id-view">233987</span> <span style="color:var(--fast-green)">✔</span></div>
        </div>
    </div>

    <!-- Background Loop System Timer -->
    <div class="timer-strip" id="countdown-clock">00:15</div>

    <!-- Core Dynamic Display Card Panel -->
    <div class="display-stage" id="stage-panel">
        <div class="stage-prompt">Choose 10<br>numbers</div>
        <div class="stage-subprompt">From 1 to 80</div>
    </div>

    <!-- Active Numeric Gameboard Grid Canvas -->
    <div class="grid-section">
        <div class="fast-grid-80" id="main-canvas"></div>
    </div>

    <!-- System Control Tray Footer Options -->
    <div class="action-tray">
        <button class="tray-btn" id="ctrl-bet">Bet: 10 ETB</button>
        <button class="tray-btn" id="ctrl-quick">Quick Pick</button>
        <button class="tray-btn" id="ctrl-clear">Clear</button>
        <div class="tray-info-text">Draw begins automatically when the countdown timer strikes 00:00</div>
    </div>

    <!-- Bottom Simulation Panel Menu Tabs -->
    <div class="bottom-navbar">
        <div class="nav-item active"><span class="nav-icon">🎮</span><span>GAME</span></div>
        <div class="nav-item"><span class="nav-icon">⏳</span><span>HISTORY</span></div>
        <div class="nav-item"><span class="nav-icon">✔</span><span>RESULTS</span></div>
        <div class="nav-item"><span class="nav-icon">📊</span><span>STATS</span></div>
    </div>
</div>

<script>
    // Traditional Casino Hypergeometric Multipliers up to 10 picks
    const CASINO_ODDS_MAP = {
        1: { 1: 3.5 },
        2: { 2: 15 },
        3: { 2: 2, 3: 50 },
        4: { 2: 1, 3: 5, 4: 150 },
        5: { 3: 3, 4: 15, 5: 500 },
        6: { 3: 2, 4: 10, 5: 50, 6: 1500 },
        7: { 4: 5, 5: 25, 6: 150, 7: 3000 },
        8: { 4: 2, 5: 15, 6: 75, 7: 500, 8: 10000 },
        9: { 5: 10, 6: 50, 7: 250, 8: 1500, 9: 25000 },
        10: { 5: 5, 6: 25, 7: 125, 8: 1000, 9: 5000, 10: 100000 }
    };

    let appState = {
        balance: 1000.00,
        bet: 10,
        selected: [],
        drawn: [],
        isDrawing: false,
        timerVal: 15,
        gameId: 233987
    };

    const canvasEl = document.getElementById('main-canvas');
    const stagePanelEl = document.getElementById('stage-panel');
    const clockEl = document.getElementById('countdown-clock');

    // Automatically executes draw round loops once time expires
    function startGlobalTimerLoop() {
        setInterval(() => {
            if (!appState.isDrawing) {
                if (appState.timerVal > 0) {
                    appState.timerVal--;
                    let sec = appState.timerVal < 10 ? '0' + appState.timerVal : appState.timerVal;
                    clockEl.textContent = `00:${sec}`;
                } else {
                    executeDrawCycle();
                }
            }
        }, 1000);
    }

    function initCanvas() {
        canvasEl.innerHTML = '';
        for (let i = 1; i <= 80; i++) {
            const cell = document.createElement('div');
            cell.className = 'grid-cell';
            cell.textContent = i;
            cell.addEventListener('click', () => handleCellSelection(i));
            canvasEl.appendChild(cell);
        }
    }

    function handleCellSelection(num) {
        if (appState.isDrawing) return;
        
        if (appState.drawn.length > 0) {
            appState.drawn = [];
        }

        const index = appState.selected.indexOf(num);
        if (index > -1) {
            appState.selected.splice(index, 1);
        } else {
            if (appState.selected.length >= 10) return; 
            appState.selected.push(num);
        }
        
        updateDisplayStage();
        syncVisualGrid();
    }

    // Calculates and dynamically renders the layout from photo_2026-05-27_18-02-03_2.jpg
    function updateDisplayStage() {
        const spotsCount = appState.selected.length;
        if (spotsCount === 0) {
            stagePanelEl.innerHTML = `
                <div class="stage-prompt">Choose 10<br>numbers</div>
                <div class="stage-subprompt">From 1 to 80</div>
            `;
            return;
        }

        // Extract maximum potential multiplier configuration
        const pickOdds = CASINO_ODDS_MAP[spotsCount] || {};
        const matches = Object.keys(pickOdds).map(Number).sort((a,b) => a - b);
        const maxMatch = matches.length > 0 ? Math.max(...matches) : 0;
        const maxMultiplier = maxMatch > 0 ? pickOdds[maxMatch] : 0;
        const possibleWinAmount = appState.bet * maxMultiplier;

        // Build Multiplier Scale Line Markup Strings
        let matchLabels = '';
        let paysLabels = '';
        matches.forEach(m => {
            matchLabels += `<div class="val-white">${m}</div>`;
            paysLabels += `<div class="val-white" style="color:var(--fast-green)">x${pickOdds[m]}</div>`;
        });

        // Build Horizontal Number Ticket boxes
        let ticketBoxesHtml = '';
        appState.selected.forEach(num => {
            ticketBoxesHtml += `<div class="strip-box">${num}</div>`;
        });

        stagePanelEl.innerHTML = `
            <div class="possible-win-container">
                <div class="win-headline">Possible win <span>${possibleWinAmount}</span></div>
                <div class="matrix-table">
                    <div class="matrix-row"><span class="lbl-mute">Match</span> ${matchLabels}</div>
                    <div class="matrix-row"><span class="lbl-mute">Pays</span> ${paysLabels}</div>
                </div>
                <div class="horizontal-selection-strip">
                    ${ticketBoxesHtml}
                </div>
            </div>
        `;
    }

    function syncVisualGrid() {
        const cells = canvasEl.children;
        for (let i = 1; i <= 80; i++) {
            const cell = cells[i - 1];
            cell.className = 'grid-cell';

            const isSelected = appState.selected.includes(i);
            const isDrawn = appState.drawn.includes(i);

            if (isSelected && isDrawn) {
                cell.classList.add('hit-block');
            } else if (isSelected) {
                cell.classList.add('selected-pin');
            }
        }

        document.getElementById('top-balance').textContent = appState.balance.toFixed(2);
        document.getElementById('game-id-view').textContent = appState.gameId;
        
        document.getElementById('ctrl-clear').disabled = appState.isDrawing;
        document.getElementById('ctrl-quick').disabled = appState.isDrawing;
        document.getElementById('ctrl-bet').disabled = appState.isDrawing;
    }

    function executeDrawCycle() {
        // Enforce fallback quick-pick values if player doesn't select targets
        if (appState.selected.length === 0) {
            forcedQuickPick();
        }

        appState.isDrawing = true;
        appState.balance -= appState.bet;
        appState.drawn = [];
        syncVisualGrid();

        stagePanelEl.innerHTML = `<div class="draw-ball-matrix" id="ball-box-wrapper"></div>`;
        const ballContainer = document.getElementById('ball-box-wrapper');

        let drawPool = Array.from({length: 80}, (_, i) => i + 1);
        let count = 0;

        let interval = setInterval(() => {
            if (count < 20) {
                let rIdx = Math.floor(Math.random() * drawPool.length);
                let selectedBall = drawPool.splice(rIdx, 1)[0];
                
                appState.drawn.push(selectedBall);
                
                const ballNode = document.createElement('div');
                ballNode.className = 'ball-capsule';
                ballNode.textContent = selectedBall;
                ballContainer.appendChild(ballNode);

                syncVisualGrid();
                count++;
            } else {
                clearInterval(interval);
                finalizeCalculations();
            }
        }, 160);
    }

    function finalizeCalculations() {
        const spotsCount = appState.selected.length;
        const hits = appState.selected.filter(n => appState.drawn.includes(n)).length;
        
        const pickOdds = CASINO_ODDS_MAP[spotsCount] || {};
        if (pickOdds[hits]) {
            let winPrize = appState.bet * pickOdds[hits];
            appState.balance += winPrize;
        }

        appState.isDrawing = false;
        appState.timerVal = 15; 
        appState.gameId += 1;   
        updateDisplayStage();
        syncVisualGrid();
    }

    function forcedQuickPick() {
        appState.selected = [];
        while(appState.selected.length < 10) {
            let r = Math.floor(Math.random() * 80) + 1;
            if(!appState.selected.includes(r)) appState.selected.push(r);
        }
    }

    document.getElementById('ctrl-clear').addEventListener('click', () => {
        appState.selected = [];
        appState.drawn = [];
        updateDisplayStage();
        syncVisualGrid();
    });

    document.getElementById('ctrl-quick').addEventListener('click', () => {
        appState.drawn = [];
        forcedQuickPick();
        updateDisplayStage();
        syncVisualGrid();
    });

    document.getElementById('ctrl-bet').addEventListener('click', () => {
        appState.bet = appState.bet >= 50 ? 10 : appState.bet + 10;
        document.getElementById('ctrl-bet').textContent = `Bet: ${appState.bet} ETB`;
        if (appState.selected.length > 0) updateDisplayStage();
    });

    initCanvas();
    syncVisualGrid();
    startGlobalTimerLoop();
</script>
</body>
</html>
